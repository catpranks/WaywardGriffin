[package]
name = "waygriff"
version = "0.1.0"
edition = "2024"

[profile.release]
overflow-checks = true

[profile.ricemax]
inherits = "release"
opt-level = 3
lto = "fat"
codegen-units = 1

[dependencies]
anyhow = { version = "1.0.104", features = ["backtrace"] }
arc-swap = "1.9.2"
ash = "0.38.0"
bytemuck = "1.25.2"
clap = { version = "4.6.7", features = ["derive"] }
copypasta = "0.10.2"
crossterm = "0.29.0"
cudarc = { version = "0.19.9", features = ["cuda-version-from-build-system"] }
drm-fourcc = "2.2.0"
evdev = "0.13.2"
humantime = "2.4.0"
image = "0.25.10"
itertools = "0.15.0"
nix = { version = "0.31.3", features = ["fs", "signal", "time"] }
pollster = "1.0.1"
ratatui = { version = "0.30.2", features = ["unstable-rendered-line-info"] }
ratatui-widgets = "0.3.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
smallvec = "1.16.1"
smithay = { version = "0.7.0", default-features = false, features = ["wayland_frontend", "backend_drm"] }
smithay-client-toolkit = "0.21.1"
toml = "1.1.6"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
vello = "0.10.0"
viuer = "0.11.0"
vulkano = "0.35.2"
vulkano-shaders = "0.35.0"
winit = "0.30.13"
x11rb = { version = "0.14.0", features = ["xtest"] }
xdg = "3.0.0"

[build-dependencies]
cc = "1.4.7"
